[package]
name = "taller"
version = "0.1.0"
edition = "2024"
publish = false
# Hay dos binarios (taller y crear-usuario): «cargo run» arranca el servidor.
default-run = "taller"

# Librería (src/lib.rs) para que las pruebas de tests/ usen el router, y binario por defecto
# (src/main.rs) que arranca el servidor.
[lib]
path = "src/lib.rs"

[[bin]]
name = "taller"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "chrono", "rust_decimal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
dotenvy = "0.15"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
